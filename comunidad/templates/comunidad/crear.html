{% extends 'comunidad/base.html' %}

{% block title %}Nuevo Servicio | ComunidadConectada{% endblock %}

{% block content %}
<div class="form-box">
    <h1 style="color: #38bdf8; margin-bottom: 1.5rem;">Registrar Nuevo Servicio</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_titulo">Título del Servicio</label>
            {{ form.titulo }}
        </div>
        <div class="form-group">
            <label for="id_descripcion">Descripción</label>
            {{ form.descripcion }}
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.6rem;">
            {{ form.activo }}
            <label for="id_activo" style="margin: 0;">Servicio activo</label>
        </div>
        <button type="submit" class="btn-primary">Guardar Servicio</button>
        <a href="{% url 'listar_servicios' %}" class="btn-toggle" style="margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
