<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ComunidadConectada{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a 60%);
            color: #f8fafc;
            min-height: 100vh;
        }
        nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { font-size: 1.25rem; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-links a:hover { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .btn-primary {
            background: #0284c7;
            color: #fff !important;
            font-weight: 600;
            border: none;
            padding: 0.55rem 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #0369a1; }
        .container { max-width: 900px; margin: 2.5rem auto; padding: 0 1.5rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 1.2rem;
            border-radius: 12px;
        }
        .stat-card span { font-size: 0.85rem; color: #94a3b8; }
        .stat-card strong { display: block; font-size: 1.8rem; color: #38bdf8; margin-top: 0.25rem; }
        .card {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-left: 4px solid #38bdf8;
            padding: 1.4rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .card h2 { font-size: 1.2rem; margin-bottom: 0.4rem; color: #f8fafc; }
        .card p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 0.7rem; }
        .badge { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
        .activo { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .inactivo { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-toggle {
            background: rgba(51, 65, 85, 0.8);
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.82rem;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            white-space: nowrap;
        }
        .btn-toggle:hover { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .form-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 2rem;
            border-radius: 14px;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 600; }
        .input-pro {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.95rem;
        }
        .input-pro:focus { outline: none; border-color: #38bdf8; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'listar_servicios' %}" class="brand">ComunidadConectada</a>
        <div class="nav-links">
            <a href="{% url 'listar_servicios' %}">Servicios</a>
            <a href="{% url 'hola_mundo' %}">Hola Mundo</a>
            <a href="/admin/">Admin</a>
            <a href="{% url 'crear_servicio' %}" class="btn-primary">+ Nuevo Servicio</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
